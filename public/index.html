    .day{margin-bottom:17px}.day-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}.day-date{font-size:11px;font-weight:800;letter-spacing:1.3px}.conflict{padding:5px 8px;background:#e7e1d6;border-radius:20px;font-size:8px;font-weight:800;letter-spacing:1px}

    .event-top{display:flex;gap:13px}.date-box{width:56px;min-width:56px;height:58px;border-radius:15px;background:#f0ede7;display:flex;flex-direction:column;align-items:center;justify-content:center}.date-day{font-size:20px;font-weight:800}.date-month{font-size:8px;letter-spacing:1.1px;color:var(--muted);margin-top:2px}.event-main{min-width:0}.category{font-size:9px;letter-spacing:1.5px;color:#998d7b;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-name{font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.12;margin-top:4px}.meta{font-size:11px;color:var(--muted);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}.badge{padding:6px 9px;border-radius:20px;font-size:8px;letter-spacing:1px;font-weight:800;text-transform:uppercase}.badge.high{background:#e9ddd8}.badge.medium{background:#e7e1d6}.badge.normal{background:#eeece7}.look-pill{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:1px;font-weight:800;text-transform:uppercase}.look-pill img{width:30px;height:30px;border-radius:10px;object-fit:cover}
    .empty{border:1px dashed #d9d3ca;border-radius:20px;padding:28px 18px;text-align:center}.empty strong{font-family:Georgia,serif;font-size:23px;font-weight:500}.empty p{font-size:12px;margin:7px 0 0}
    .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(540px,100%);padding:10px 16px calc(10px + var(--safe-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;align-items:end}.nav-btn{font-size:10px;color:#9a968d;display:flex;align-items:center;flex-direction:column;gap:5px}.nav-btn.active{color:var(--ink);font-weight:800}.nav-plus{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin:-26px auto 0;font-size:24px;box-shadow:0 12px 30px rgba(0,0,0,.16)}
    .sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(20,18,15,.38);align-items:flex-end}.sheet.open{display:flex}.panel{width:100%;max-width:540px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 20px calc(22px + var(--safe-bottom));max-height:91vh;overflow:auto}.grab{width:40px;height:5px;border-radius:5px;background:#d6d1c8;margin:0 auto 16px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.panel-title{font-family:Georgia,serif;font-size:28px}.panel-sub{font-size:11px;color:var(--muted);margin-top:5px}.x{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center}.field{margin-top:12px}.label{font-size:9px;letter-spacing:1.4px;font-weight:800;color:#7b766e;text-transform:uppercase;margin-bottom:6px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#b8b1a4}.textarea{min-height:74px;resize:vertical}.primary{width:100%;height:52px;background:var(--ink);color:#fff;border-radius:26px;margin-top:16px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;font-size:10px}.outline{width:100%;height:50px;border:1px solid var(--ink);border-radius:25px;margin-top:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;font-size:10px}.danger{color:#9a4b40;font-weight:800;letter-spacing:1px;font-size:10px;text-transform:uppercase;padding:14px 0}.upload-area{border:1px dashed #d4cec4;border-radius:18px;background:#fff;padding:19px;text-align:center}.upload-area strong{font-size:14px}.upload-area p{font-size:11px;margin:5px 0 0}.file-name{margin-top:8px;font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.review-list{margin-top:12px}.review-card{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}.review-top{display:flex;gap:11px}.review-date{width:50px;height:50px;background:#f0ede7;border-radius:14px;display:grid;place-items:center;align-content:center}.review-date b{font-size:17px}.review-date span{font-size:8px;color:var(--muted);letter-spacing:1px}.review-title{font-family:Georgia,serif;font-size:19px}.review-category{font-size:8px;color:#998d7b;letter-spacing:1.2px;font-weight:800;margin-top:3px}.review-meta{font-size:10px;color:var(--muted);margin-top:7px}.priority-row{display:flex;gap:7px;margin-top:10px}.pbtn{flex:1;height:33px;border-radius:18px;border:1px solid var(--line);font-size:8px;letter-spacing:.8px;font-weight:800}.pbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
    .look-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.look{background:#fff;border-radius:17px;overflow:hidden;border:1px solid rgba(0,0,0,.025);box-shadow:var(--shadow)}.look img{display:block;width:100%;aspect-ratio:1/1.18;object-fit:cover}.look-body{padding:11px}.look-name{font-size:13px;font-weight:800}.look-notes{font-size:9px;color:var(--muted);margin-top:4px;line-height:1.3}.look-add{background:#fff;border:1px dashed #d4cec4;border-radius:17px;min-height:220px;display:grid;place-items:center;text-align:center;padding:15px}.look-add strong{font-size:13px}.look-add p{font-size:10px;margin:5px 0 0}
    .choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.choice{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left}.choice.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.choice img{width:100%;aspect-ratio:1/1.1;display:block;object-fit:cover}.choice div{padding:9px;font-size:10px;font-weight:800}.small-actions{display:flex;gap:8px}.small-actions button{flex:1;height:43px;border-radius:22px;border:1px solid var(--line);font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.small-actions .solid{background:var(--ink);color:#fff;border-color:var(--ink)}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#171717;color:#fff;padding:11px 14px;border-radius:18px;font-size:11px;z-index:80;display:none;max-width:88%;text-align:center}.toast.show{display:block}
    .loader{display:none;position:fixed;inset:0;z-index:100;background:rgba(247,245,239,.72);backdrop-filter:blur(8px);place-items:center}.loader.show{display:grid}.loader-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:18px 19px;display:flex;gap:11px;align-items:center;font-size:11px;letter-spacing:1px;font-weight:800}.spinner{width:18px;height:18px;border-radius:50%;border:2px solid #ddd;border-top-color:#171717;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .install{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-top:14px;display:flex;gap:10px;align-items:flex-start}.install b{font-size:11px}.install span{font-size:10px;color:var(--muted);display:block;margin-top:4px;line-height:1.4}.install button{font-size:9px;letter-spacing:1px;font-weight:800;text-transform:uppercase;white-space:nowrap}
    .hidden{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}.file-label{cursor:pointer}.profile-chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px 6px 6px;box-shadow:var(--shadow);font-size:10px;font-weight:800}.profile-avatar{width:28px;height:28px;border-radius:50%;background:#f0ede7;display:grid;place-items:center;font-size:14px}.profile-name{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-list{display:grid;gap:9px;margin-top:12px}.profile-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}.profile-item.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.profile-item .pi-meta{flex:1}.profile-item .pi-name{font-size:12px;font-weight:800}.profile-item .pi-sub{font-size:9px;color:var(--muted);margin-top:3px}.profile-item button{font-size:9px;letter-spacing:.8px;font-weight:800;text-transform:uppercase}.profile-add{margin-top:10px;display:flex;gap:8px}.profile-add input{flex:1}.profile-delete{color:#9a4b40}
  
    .ocr-progress{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + var(--safe-top));z-index:70;background:#171717;color:#fff;padding:9px 12px;border-radius:16px;font-size:10px;letter-spacing:.7px;display:none;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.15)}.ocr-progress.show{display:block}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div><div class="brand">DRESSED</div><div class="tagline">YOUR PLANS. YOUR PEOPLE. YOUR LOOK.</div></div>
    <div style="display:flex;gap:7px;align-items:center">
      <button class="profile-chip" id="profileBtn" aria-label="Switch profile"><span class="profile-avatar" id="profileAvatar">☺</span><span class="profile-name" id="profileName">Me</span>⌄</button>
      <button class="round-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
    </div>
  </header>

  <main class="content" id="content"></main>

  <nav class="nav">
    <button class="nav-btn active" data-tab="home"><span style="font-size:19px">⌂</span><span>HOME</span></button>
    <button class="nav-btn" data-tab="calendar"><span style="font-size:18px">▦</span><span>CALENDAR</span></button>
    <label class="nav-plus file-label" for="inviteFile" id="addBtn" aria-label="Add invitation">＋</label>
    <button class="nav-btn" data-tab="looks"><span style="font-size:18px">◌</span><span>MY LOOKS</span></button>
  </nav>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="loader" id="loader"><div class="loader-card"><span class="spinner"></span><span id="loaderText">READING YOUR INVITATION…</span></div></div>
<div class="toast" id="toast"></div>
<div id="ocrProgress" class="ocr-progress" aria-live="polite"></div>

<input id="inviteFile" type="file" accept="application/pdf,image/*,video/*" class="hidden">
<input id="lookFile" type="file" accept="image/*" class="hidden">

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const state={tab:'home',events:[],looks:[],review:null,sourceName:'',selectedEvent:null,lookForEvent:null,selectedLook:null,pendingLook:null,profiles:[],activeProfileId:null};
const DB_NAME='dressed-private-v5';
const DB_VERSION=1;
let db=null;
let storageMode='idb';
const memoryStore={profiles:[],settings:[]};
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtDate(date,opts={weekday:'short',day:'2-digit',month:'short'}){return new Date(date+'T12:00:00').toLocaleDateString('en-IN',opts).toUpperCase()}
function parts(date){const d=new Date(date+'T12:00:00');return {day:d.getDate(),month:d.toLocaleDateString('en-IN',{month:'short'}).toUpperCase()}}
function timeDisplay(t){const m=String(t||'').match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i);if(!m)return t||'';if(!m[3])return t;return `${m[1]}:${m[2]||'00'} ${m[3].toUpperCase()}`+(String(t).toLowerCase().includes('onwards')?' onwards':'')}
function startDate(date,time){let m=String(time||'').match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i);let h=m?Number(m[1]):19,mi=m?Number(m[2]||0):0,ap=m?.[3]?.toUpperCase();if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;return new Date(`${date}T${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}:00`)}
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function showLoader(msg){document.getElementById('loaderText').textContent=msg;document.getElementById('loader').classList.add('show')}
function hideLoader(){document.getElementById('loader').classList.remove('show')}
function progress(msg){const el=document.getElementById('ocrProgress');if(!el)return;el.textContent=msg||'';el.classList.toggle('show',!!msg)}
function openSheet(html){document.getElementById('panel').innerHTML=html;document.getElementById('sheet').classList.add('open');document.querySelectorAll('[data-close-sheet]').forEach(x=>x.onclick=closeSheet)}
function closeSheet(){document.getElementById('sheet').classList.remove('open');state.selectedEvent=null;state.lookForEvent=null;state.selectedLook=null;state.pendingLook=null}
function uid(prefix='id'){return prefix+'_'+Math.random().toString(36).slice(2)+Date.now().toString(36)}
function profileKey(){return state.activeProfileId||'default'}

function memGetAll(store){return (memoryStore[store]||[]).slice()}
function memGet(store,key){return (memoryStore[store]||[]).find(x=>x.id===key||x.key===key)||null}
function memPut(store,item){const arr=memoryStore[store]||[];const idx=arr.findIndex(x=>(x.id||x.key)===(item.id||item.key));if(idx>=0)arr[idx]=item;else arr.push(item);memoryStore[store]=arr;return item}
function put(store,item){if(storageMode!=='idb')return Promise.resolve(memPut(store,item));return new Promise((resolve,reject)=>{try{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(item);tx.oncomplete=()=>resolve(item);tx.onerror=()=>reject(tx.error||new Error('Storage write failed'));tx.onabort=()=>reject(tx.error||new Error('Storage write aborted'))}catch(e){storageMode='memory';memPut(store,item);resolve(item)}})}
function get(store,key){if(storageMode!=='idb')return Promise.resolve(memGet(store,key));return new Promise((resolve,reject)=>{try{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error('Storage read failed'))}catch(e){storageMode='memory';resolve(memGet(store,key))}})}
function getAll(store){if(storageMode!=='idb')return Promise.resolve(memGetAll(store));return new Promise((resolve,reject)=>{try{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error||new Error('Storage read failed'))}catch(e){storageMode='memory';resolve(memGetAll(store))}})}

async function importOldProfiles(){
  let imported=[];
  try{
    const oldReq=indexedDB.open('dressed-private-v4',1);
    await new Promise(resolve=>{
      oldReq.onsuccess=()=>{
        try{
          const od=oldReq.result;
          if(!od.objectStoreNames.contains('profiles')){od.close();resolve();return;}
          const tx=od.transaction('profiles','readonly');
          const q=tx.objectStore('profiles').getAll();
          q.onsuccess=()=>{imported=q.result||[];od.close();resolve()};
          q.onerror=()=>{od.close();resolve()};
        }catch(_){resolve()}
      };
      oldReq.onerror=()=>resolve();
      oldReq.onblocked=()=>resolve();
    });
  }catch(_){ }
  return imported;
}

async function initDB(){
  try{
    if(!('indexedDB' in window)) throw new Error('IndexedDB unavailable');
    db=await new Promise((resolve,reject)=>{
      const req=indexedDB.open(DB_NAME,DB_VERSION);
      req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('profiles'))d.createObjectStore('profiles',{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'id'});};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('Could not open IndexedDB'));
      req.onblocked=()=>reject(new Error('Database is blocked'));
    });
    storageMode='idb';
    let ps=await getAll('profiles');
    if(!ps.length){
      let old=await importOldProfiles();
      if(old.length){for(const p of old) await put('profiles',p);ps=old;}
      else{const p={id:uid('profile'),name:'Me',emoji:'☺',events:[],looks:[]};await put('profiles',p);ps=[p]}
    }
    state.profiles=ps;
    let active=(await get('settings','active-profile'))?.value || ps[0].id;
    if(!ps.some(p=>p.id===active)) active=ps[0].id;
    state.activeProfileId=active;
    await put('settings',{id:'active-profile',value:active});
    const activeP=ps.find(p=>p.id===active)||ps[0];
    state.events=Array.isArray(activeP.events)?activeP.events:[];
    state.looks=Array.isArray(activeP.looks)?activeP.looks:[];
    return;
  }catch(err){
    storageMode='memory';db=null;
    state.profiles=memoryStore.profiles;
    if(!state.profiles.length){const p={id:uid('profile'),name:'Me',emoji:'☺',events:[],looks:[]};memPut('profiles',p);state.profiles=[p]}
    state.activeProfileId=state.profiles[0].id;
    state.events=state.profiles[0].events||[];
    state.looks=state.profiles[0].looks||[];
    toast('DRESSED opened in temporary mode. Your browser is blocking local storage.');
  }
}
async function saveCurrentProfile(){
  if(!state.activeProfileId)return;
  const p=state.profiles.find(x=>x.id===state.activeProfileId);
  if(!p)return;
  p.events=state.events;
  p.looks=state.looks;
  await put('profiles',p);
}
async function switchProfile(id){const p=state.profiles.find(x=>x.id===id);if(!p)return;await saveCurrentProfile();state.activeProfileId=id;state.events=p.events||[];state.looks=p.looks||[];await put('settings',{id:'active-profile',value:id});updateProfileChip();closeSheet();render();toast('Switched to '+p.name)}
function updateProfileChip(){const p=state.profiles.find(x=>x.id===state.activeProfileId)||{name:'Me',emoji:'☺'};const a=document.getElementById('profileAvatar'),n=document.getElementById('profileName');if(a)a.textContent=p.emoji||'☺';if(n)n.textContent=p.name||'Me'}
function render(){const c=document.getElementById('content');if(state.tab==='home')c.innerHTML=homeView();else if(state.tab==='calendar')c.innerHTML=calendarView();else c.innerHTML=looksView();wire();updateProfileChip()}
function homeView(){const future=[...state.events].sort((a,b)=>a.date.localeCompare(b.date)||startDate(a.date,a.time)-startDate(b.date,b.time));const grouped={};future.forEach(e=>(grouped[e.date]??=[]).push(e));return `<section class="hero"><div class="eyebrow">DRESSED / YOUR SOCIAL LIFE</div><h1>Ready when<br>you are.</h1><p>Upload an invitation — PDF, photo or video — and DRESSED reads it on your device, turning the fine print into clean, editable plans.</p><div class="quick"><label class="quick-card file-label" for="inviteFile" data-action="add-invite"><span class="quick-icon">✦</span><span><div class="quick-title">Add Invitation</div><div class="quick-sub">PDF, photo or video</div></span></label><button class="quick-card alt" data-action="add-look"><span class="quick-icon">◒</span><span><div class="quick-title">Add a Look</div><div class="quick-sub">Save an outfit</div></span></button></div><div class="install" id="installCard"><div style="font-size:18px">⌂</div><div style="flex:1"><b>Put DRESSED on your iPhone</b><span>In Safari, tap Share → Add to Home Screen. It will open like an app.</span></div><button id="hideInstall">Got it</button></div><div style="font-size:10px;color:var(--muted);margin-top:11px">No OpenAI API key required. PDFs, photos and video frames are processed in your browser.</div></section><div class="section-head"><h2>Upcoming</h2><span class="muted">${future.length} EVENT${future.length===1?'':'S'}</span></div>${future.length?Object.entries(grouped).slice(0,6).map(([date,items])=>dayBlock(date,items)).join(''):`<div class="empty"><strong>No plans yet.</strong><p>Your next invitation can become your first DRESSED calendar.</p></div>`}`}
function dayBlock(date,items){return `<section class="day"><div class="day-head"><span class="day-date">${fmtDate(date,{weekday:'long',day:'numeric',month:'long'})}</span>${items.length>1?`<span class="conflict">${items.length} EVENTS · PRIORITY DAY</span>`:''}</div>${items.map(eventCard).join('')}</section>`}
function eventCard(e){const p=parts(e.date);const look=state.looks.find(l=>l.id===e.lookId);return `<article class="event"><div class="event-top"><div class="date-box"><div class="date-day">${p.day}</div><div class="date-month">${p.month}</div></div><div class="event-main"><div class="category">${esc(e.category||'SOCIAL EVENT')}</div><div class="event-name">${esc(e.name)}</div><div class="meta">${esc(timeDisplay(e.time))}${e.venue?' · '+esc(e.venue):''}</div></div></div><div class="event-foot"><span class="badge ${(e.priority||'Normal').toLowerCase()}">${esc(e.priority||'Normal')}</span><button class="look-pill" data-event-look="${esc(e.id)}">${look?`<img src="${esc(look.dataUrl)}" alt=""><span>${esc(look.name)}</span>`:'＋ ADD LOOK'}</button><button class="round-btn" style="width:32px;height:32px;box-shadow:none;background:#f4f1eb" data-event="${esc(e.id)}">›</button></div></article>`}
function calendarView(){const months={};[...state.events].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const key=e.date.slice(0,7);(months[key]??=[]).push(e)});return `<section class="hero"><div class="eyebrow">DRESSED / CALENDAR</div><h1>Your social<br>calendar.</h1><p>Everything you have coming up, with your chosen look attached.</p></section>${Object.keys(months).length?Object.keys(months).sort().map(m=>`<section class="day"><div class="section-head" style="margin-top:0"><h2>${new Date(m+'-15T12:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2></div>${months[m].map(eventCard).join('')}</section>`).join(''):`<div class="empty"><strong>Nothing on the calendar.</strong><p>Add an invitation and we'll build it for you.</p></div>`}`}
function looksView(){return `<section class="hero"><div class="eyebrow">DRESSED / MY LOOKS</div><h1>Dress for<br>the plan.</h1><p>Save outfits once, then attach the right look to every event.</p></section><div class="look-grid"><button class="look-add" data-action="add-look"><div><strong>＋ Add a look</strong><p>Upload an outfit photo and name it.</p></div></button>${state.looks.map(l=>`<div class="look"><img src="${esc(l.dataUrl)}" alt="${esc(l.name)}"><div class="look-body"><div class="look-name">${esc(l.name)}</div>${l.notes?`<div class="look-notes">${esc(l.notes)}</div>`:''}</div></div>`).join('')}</div>`}
function wire(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));render()});document.querySelectorAll('[data-action="add-invite"]').forEach(b=>b.classList.add('file-label'));document.querySelectorAll('[data-action="add-look"]').forEach(b=>b.onclick=()=>openAddLook());document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>openEvent(b.dataset.event));document.querySelectorAll('[data-event-look]').forEach(b=>b.onclick=()=>openLookPicker(b.dataset.event));const h=document.getElementById('hideInstall');if(h)h.onclick=()=>document.getElementById('installCard')?.remove()}
document.getElementById('settingsBtn').onclick=()=>openSettings();document.getElementById('profileBtn').onclick=()=>openProfiles();document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

document.getElementById('inviteFile').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;await processInvite(file)});
document.getElementById('addBtn')?.addEventListener('click',()=>{const input=document.getElementById('inviteFile');try{input?.click()}catch(_){toast('Please use Safari to choose an invitation file.')}});
document.getElementById('lookFile').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(file)await makeLookFromFile(file)});
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-action="add-invite"]');if(b){e.preventDefault();const input=document.getElementById('inviteFile');try{input?.click()}catch(_){toast('Please use Safari to choose an invitation file.')}}},{passive:false});

async function processInvite(file){state.sourceName=file.name||'Invitation';try{showLoader('READING YOUR INVITATION…');progress('Preparing local invitation reader…');let text='';if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){text=await extractPdfText(file)}else if(file.type.startsWith('video/')||/\.(mp4|mov|webm|m4v)$/i.test(file.name)){text=normalizeInvitationText(await extractVideoText(file))}else if(file.type.startsWith('image/')){text=normalizeInvitationText(await extractImageText(file))}else{throw new Error('Please choose a PDF, photo or video invitation.')}progress('Finding dates, times and venues…');const parsed=parseInvitation(text);hideLoader();progress('');if(!parsed.events.length){openNoEventReview(state.sourceName,text);return}openReview(parsed,state.sourceName,false)}catch(err){hideLoader();progress('');toast(err?.message||'Could not read that invitation.')}}
function openNoEventReview(sourceName,rawText){openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">INVITATION READ</div><div class="panel-title">No event detected yet</div><div class="panel-sub">DRESSED did not find a reliable date/time pair. Nothing was lost.</div></div><button class="x" data-close-sheet>×</button></div><div class="empty" style="margin-top:15px"><strong>Let's add it manually.</strong><p>You can enter the event details below. The original invitation stays on your device.</p></div><button class="primary" id="manualAddFromInvite">＋ Add event manually</button><button class="outline" data-close-sheet>Close</button>`);document.getElementById('manualAddFromInvite').onclick=()=>openManualEvent(sourceName)}
function openManualEvent(sourceName){openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">DRESSED / MANUAL</div><div class="panel-title">Add an event</div><div class="panel-sub">Add the details you can see on the invitation.</div></div><button class="x" data-close-sheet>×</button></div><div class="field"><div class="label">Event name</div><input class="input" id="mfName" placeholder="e.g. Cocktail Night"></div><div class="field"><div class="label">Date</div><input class="input" id="mfDate" type="date"></div><div class="field"><div class="label">Time</div><input class="input" id="mfTime" placeholder="9:00 PM onwards"></div><div class="field"><div class="label">Venue</div><input class="input" id="mfVenue" placeholder="Venue"></div><div class="field"><div class="label">Category</div><input class="input" id="mfCat" placeholder="e.g. Cocktail Night"></div><button class="primary" id="saveManual">Add to DRESSED</button>`);document.getElementById('saveManual').onclick=async()=>{const e={id:uid('evt'),name:val('mfName')||'Social event',date:val('mfDate')||new Date().toISOString().slice(0,10),time:val('mfTime'),venue:val('mfVenue'),category:val('mfCat')||'SOCIAL EVENT',dress_code:null,host:null,priority:'Normal',confidence:1,notes:`Added from ${sourceName||'invitation'}`,lookId:null};state.events.push(e);await saveCurrentProfile();closeSheet();state.tab='home';render();toast('Event added')}}

async function extractPdfText(file){progress('Reading PDF pages locally…');const data=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data}).promise;let all=[];for(let i=1;i<=pdf.numPages;i++){progress(`Reading PDF page ${i} of ${pdf.numPages}…`);const page=await pdf.getPage(i);const tc=await page.getTextContent();const lines=normalizePdfTextItems(tc.items.map(x=>x.str));if(lines.trim()){all.push(normalizeInvitationText(lines))}else{progress(`Scanning PDF page ${i} with OCR…`);const canvas=document.createElement('canvas');const viewport=page.getViewport({scale:1.5});canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;const r=await Tesseract.recognize(canvas,'eng',{logger:m=>{if(m.status&&m.progress)progress(`OCR page ${i}: ${m.status} ${Math.round(m.progress*100)}%`)}});all.push(normalizeInvitationText(r.data.text||''))}}return all.join('\n\n')}
function normalizePdfTextItems(items){let out=[];let lastY=null;let line='';for(const s of items){const y=Number.isFinite(s.transform?.[5])?Math.round(s.transform[5]):null;if(lastY!==null&&y!==null&&Math.abs(y-lastY)>4){if(line.trim())out.push(line.trim());line=''}line+=(line?' ':'')+String(s.str||'');lastY=y}if(line.trim())out.push(line.trim());return out.join('\n')}
function normalizeInvitationText(raw){const monthNames='JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER';return String(raw||'').replace(/\r/g,'\n').split(/\n+/).map(line=>{const segments=line.trim().split(/\s{2,}/).filter(Boolean);const rebuilt=segments.map(seg=>{const tokens=seg.trim().split(/\s+/).filter(Boolean);const out=[];let run=[];let runType='';const flush=()=>{if(run.length){out.push(run.join(''));run=[];runType=''}};for(const t of tokens){if(/^[\p{L}\p{N}]$/u.test(t)){const type=/^\p{N}$/u.test(t)?'digit':'alpha';if(run.length&&type!==runType)flush();run.push(t);runType=type}else{flush();out.push(t)}}flush();return out.join(' ')});let s=rebuilt.join(' ');s=s.replace(/\s*([,])\s*/g,'$1 ');s=s.replace(/\s*:\s*/g,':');s=s.replace(new RegExp('\\b(\\d{1,2})\\s*('+monthNames+')\\s*(20\\d{2})\\b','gi'),'$1 $2 $3');s=s.replace(/\s+([;&-])\s+/g,' $1 ');s=s.replace(/\s{2,}/g,' ').trim();return s}).filter(Boolean).join('\n')}
async function extractImageText(file){progress('Reading invitation image…');const {data}=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.status&&m.progress)progress(`OCR: ${m.status} ${Math.round(m.progress*100)}%`)}});return data.text||''}
async function extractVideoText(file){progress('Opening video…');const url=URL.createObjectURL(file);const video=document.createElement('video');video.preload='metadata';video.muted=true;video.playsInline=true;video.src=url;await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(new Error('This video could not be opened on your iPhone.'))});const duration=Number(video.duration||0);if(!isFinite(duration)||duration<=0)throw new Error('This video has no readable duration.');const count=Math.min(10,Math.max(4,Math.ceil(duration/3)));const times=[...Array(count)].map((_,i)=>duration*(i/(count-1)));const canvas=document.createElement('canvas');const maxW=1100;const scale=Math.min(1,maxW/(video.videoWidth||1280));canvas.width=Math.max(1,Math.round((video.videoWidth||1280)*scale));canvas.height=Math.max(1,Math.round((video.videoHeight||720)*scale));const ctx=canvas.getContext('2d');let all=[];try{for(let i=0;i<times.length;i++){progress(`Scanning video frame ${i+1} of ${times.length}…`);await seekVideo(video,times[i]);ctx.drawImage(video,0,0,canvas.width,canvas.height);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.82));const {data}=await Tesseract.recognize(blob,'eng',{logger:m=>{if(m.status&&m.progress)progress(`OCR frame ${i+1}: ${m.status} ${Math.round(m.progress*100)}%`)}});if(data.text?.trim())all.push(`FRAME ${i+1}\n${data.text}`)}}finally{URL.revokeObjectURL(url);video.remove()}return all.join('\n\n')}
function seekVideo(video,t){return new Promise((resolve,reject)=>{const done=()=>{cleanup();resolve()};const fail=()=>{cleanup();reject(new Error('Could not sample this video.'))};const cleanup=()=>{video.removeEventListener('seeked',done);video.removeEventListener('error',fail)};video.addEventListener('seeked',done,{once:true});video.addEventListener('error',fail,{once:true});video.currentTime=Math.min(Math.max(0,t),Math.max(0,video.duration-.05))})}

const MONTHS={JANUARY:1,FEBRUARY:2,MARCH:3,APRIL:4,MAY:5,JUNE:6,JULY:7,AUGUST:8,SEPTEMBER:9,OCTOBER:10,NOVEMBER:11,DECEMBER:12};
function cleanLine(s){return String(s||'').replace(/[•·|]/g,' ').replace(/\s+/g,' ').trim()}
function normalizeMonth(m){m=String(m||'').toUpperCase();const exact=MONTHS[m];if(exact)return exact;return Object.keys(MONTHS).findIndex(x=>x.startsWith(m))+1}
function parseDateLine(line,defaultYear=null){const m=String(line||'').match(/\b(\d{1,2})(?:ST|ND|RD|TH)?[\s,.-]+([A-Z]{3,9})(?:[\s,.-]+(20\d{2}))?\b/i);if(!m)return null;const month=normalizeMonth(m[2]);if(!month)return null;const year=Number(m[3]||defaultYear||new Date().getFullYear());return `${year}-${String(month).padStart(2,'0')}-${String(Number(m[1])).padStart(2,'0')}`}
function parseInvitation(raw){const text=normalizeInvitationText(String(raw||'').replace(/\r/g,'\n').replace(/[\u00a0]/g,' '));const lines=text.split(/\n+/).map(cleanLine).filter(Boolean);let overallHost='',overallVenue='',overallName='';for(const line of lines){if(!overallHost&&/^(WADHAWAN FAMILY|[A-Z][A-Z &.-]{4,})$/.test(line))overallHost=line;if(!overallVenue&&/(LE MÉRIDIEN|LE MERIDIEN|HOTEL|RESORT|DEHRADUN)/i.test(line)&&line.length<80)overallVenue=line;if(!overallName&&/PRE[- ]?WEDDING|WEDDING FESTIVITIES|BIRTHDAY|CELEBRATION/i.test(line))overallName=line}
let yearMatch=text.match(/\b(20\d{2})\b/);const defaultYear=yearMatch?Number(yearMatch[1]):new Date().getFullYear();let blocks=[];let current=null;for(let i=0;i<lines.length;i++){const d=parseDateLine(lines[i],defaultYear);if(d){if(current)blocks.push(current);current={date:d,lines:[],time:'',name:'',category:'',venue:''};continue}if(current)current.lines.push(lines[i]);}if(current)blocks.push(current);
const events=[];for(const b of blocks){const idxTime=b.lines.findIndex(x=>/(\d{1,2})(?::\d{2})?\s*(AM|PM)\b/i.test(x));if(idxTime>=0)b.time=(b.lines[idxTime].match(/\d{1,2}(?::\d{2})?\s*(?:AM|PM)\b[^\n]*/i)||[''])[0].trim();const venueIdx=b.lines.findIndex(x=>/^VENUE\s*[:\-]/i.test(x));if(venueIdx>=0)b.venue=cleanLine(b.lines[venueIdx].replace(/^VENUE\s*[:\-]?\s*/i,''));else{const vi=b.lines.findIndex(x=>/\b(?:LAWN|BALLROOM|TERRACE|POOL|CURRENT|HALL|ROOM|GARDEN|BANQUET|CLUBHOUSE|AREA)\b/i.test(x)&&x.length<70);if(vi>=0)b.venue=b.lines[vi]}
let titleCandidates=[];const start=idxTime>=0?idxTime+1:0;for(let j=start;j<b.lines.length;j++){const x=b.lines[j];if(!x||/^VENUE/i.test(x))continue;if(/^(FRIDAY|SATURDAY|SUNDAY|MONDAY|TUESDAY|WEDNESDAY|THURSDAY)\b/i.test(x))continue;if(/^(\d{1,2})(?::\d{2})?\s*(AM|PM)/i.test(x))continue;if(/^(WHERE|AN |A LITTLE|DRESS|SEE YOU|AN ODE|WARM REGARDS|THE CELEBRATION|A NIGHT)/i.test(x))continue;if(x.length>65)continue;titleCandidates.push(x)}
if(titleCandidates.length){b.name=titleCandidates.find(x=>/[A-Za-z]/.test(x)&&!/^\[/.test(x))||titleCandidates[0]||''}const cat=b.lines.find(x=>x===x.toUpperCase()&&/[A-Z]/.test(x)&&x.length>=4&&x.length<=40&&x!==b.name&&!/^VENUE/.test(x)&&!/^FRIDAY|^SATURDAY|^SUNDAY|^MONDAY|^TUESDAY|^WEDNESDAY|^THURSDAY/.test(x)&&!/(\d{1,2})(?::\d{2})?\s*(AM|PM)\b/i.test(x));b.category=cat||'';if(b.name||b.time||b.venue)events.push({name:b.name||'Untitled event',date:b.date,time:b.time||'',venue:b.venue||overallVenue||'',category:b.category||'SOCIAL EVENT',dress_code:null,host:overallHost||null,priority:'Normal',confidence:b.name&&b.time&&b.date?1:.75,notes:null})}
// De-duplicate repeated OCR/PDF blocks.
const seen=new Set(), clean=[];for(const e of events){const key=[e.date,e.name.toLowerCase(),e.time.toLowerCase(),e.venue.toLowerCase()].join('|');if(!seen.has(key)){seen.add(key);clean.push(e)}}return {overall_event_name:overallName||null,overall_host:overallHost||null,overall_venue:overallVenue||null,events:clean}}

function openReview(result,sourceName,isDemo=false){state.sourceName=sourceName;state.review=(result.events||[]).map((e,i)=>({...e,reviewId:uid('review'),priority:e.priority||'Normal'}));openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">${isDemo?'DRESSED DEMO':'INVITATION READ'}</div><div class="panel-title">${state.review.length} event${state.review.length===1?'':'s'} found</div><div class="panel-sub">${esc(sourceName)} · Check details before adding.</div></div><button class="x" data-close-sheet>×</button></div><div class="review-list">${state.review.map(reviewCard).join('')}</div><button class="primary" id="saveReview">Add ${state.review.length} event${state.review.length===1?'':'s'} to DRESSED</button><button class="outline" data-close-sheet>Cancel</button>`);document.getElementById('saveReview').onclick=saveReview;document.querySelectorAll('[data-edit-review]').forEach(b=>b.onclick=()=>editReview(b.dataset.editReview));document.querySelectorAll('[data-pick-review]').forEach(b=>b.onclick=()=>pickReviewPriority(b.dataset.pickReview))}
function reviewCard(e){const p=parts(e.date);return `<div class="review-card" data-review="${e.reviewId}"><div class="review-top"><div class="review-date"><b>${p.day}</b><span>${p.month}</span></div><div style="flex:1"><input class="input" value="${esc(e.name)}" data-rf="name" style="padding:8px 10px;font-family:Georgia,serif;font-size:18px"><div class="review-category">${esc(e.category||'SOCIAL EVENT')}</div><div class="review-meta">${esc(timeDisplay(e.time))}${e.venue?' · '+esc(e.venue):''}</div></div></div><div class="small-actions" style="margin-top:9px"><button data-edit-review="${e.reviewId}">Edit details</button><button class="solid" data-pick-review="${e.reviewId}">Priority: ${esc(e.priority||'Normal')}</button></div></div>`}
function editReview(id){const e=state.review.find(x=>x.reviewId===id);if(!e)return;openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">REVIEW EVENT</div><div class="panel-title">Edit details</div><div class="panel-sub">Correct anything the local reader missed.</div></div><button class="x" data-close-sheet>×</button></div><div class="field"><div class="label">Name</div><input class="input" id="rfName" value="${esc(e.name)}"></div><div class="field"><div class="label">Category</div><input class="input" id="rfCat" value="${esc(e.category||'')}"></div><div class="field"><div class="label">Date</div><input class="input" id="rfDate" type="date" value="${esc(e.date)}"></div><div class="field"><div class="label">Time</div><input class="input" id="rfTime" value="${esc(e.time||'')}"></div><div class="field"><div class="label">Venue</div><input class="input" id="rfVenue" value="${esc(e.venue||'')}"></div><div class="field"><div class="label">Dress code</div><input class="input" id="rfDress" value="${esc(e.dress_code||'')}"></div><button class="primary" id="saveReviewEdit">Save details</button>`);document.getElementById('saveReviewEdit').onclick=()=>{Object.assign(e,{name:val('rfName')||e.name,category:val('rfCat'),date:val('rfDate'),time:val('rfTime'),venue:val('rfVenue'),dress_code:val('rfDress')||null});closeSheet();setTimeout(()=>openReview({events:state.review},state.sourceName,false),70)}}
function pickReviewPriority(id){const e=state.review.find(x=>x.reviewId===id);if(!e)return;openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">PRIORITY</div><div class="panel-title">How important is this?</div><div class="panel-sub">Useful when more than one event lands on the same day.</div></div><button class="x" data-close-sheet>×</button></div><div class="choice-grid" style="grid-template-columns:1fr"><button class="choice" id="prHigh"><div style="padding:16px">HIGH</div></button><button class="choice" id="prMedium"><div style="padding:16px">MEDIUM</div></button><button class="choice" id="prNormal"><div style="padding:16px">NORMAL</div></button></div>`);document.getElementById('prHigh').onclick=()=>setReviewPriority(e,'High');document.getElementById('prMedium').onclick=()=>setReviewPriority(e,'Medium');document.getElementById('prNormal').onclick=()=>setReviewPriority(e,'Normal')}
function setReviewPriority(e,p){e.priority=p;closeSheet();setTimeout(()=>openReview({events:state.review},state.sourceName,false),70)}
function saveReview(){document.querySelectorAll('[data-review]').forEach(card=>{const id=card.dataset.review;const e=state.review.find(x=>x.reviewId===id);const inp=card.querySelector('[data-rf="name"]');if(e&&inp)e.name=inp.value.trim()||e.name});const existingByKey=new Set(state.events.map(e=>`${e.date}|${e.name}`));state.review.forEach(e=>{const clean={id:uid('evt'),name:e.name.trim(),date:e.date,time:e.time,venue:e.venue||'',category:e.category||'SOCIAL EVENT',dress_code:e.dress_code||null,host:e.host||null,priority:e.priority||'Normal',confidence:e.confidence??1,notes:e.notes||null,lookId:null};if(!existingByKey.has(`${clean.date}|${clean.name}`))state.events.push(clean)});state.events.forEach(e=>{if(state.events.filter(x=>x.date===e.date).length>1 && e.priority==='Normal')e.priority='Medium'});saveCurrentProfile().then(()=>{closeSheet();state.tab='home';document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab==='home'));render();toast('Added to DRESSED')})}
function openEvent(id){const e=state.events.find(x=>x.id===id);if(!e)return;state.selectedEvent=e;openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">EVENT</div><div class="panel-title">Edit event</div><div class="panel-sub">Make the details yours.</div></div><button class="x" data-close-sheet>×</button></div><div class="field"><div class="label">Name</div><input class="input" id="efName" value="${esc(e.name)}"></div><div class="field"><div class="label">Category</div><input class="input" id="efCategory" value="${esc(e.category||'')}"></div><div class="field"><div class="label">Date</div><input class="input" id="efDate" type="date" value="${esc(e.date)}"></div><div class="field"><div class="label">Time</div><input class="input" id="efTime" value="${esc(e.time||'')}"></div><div class="field"><div class="label">Venue</div><input class="input" id="efVenue" value="${esc(e.venue||'')}"></div><div class="field"><div class="label">Priority</div><select class="select" id="efPriority"><option>High</option><option>Medium</option><option>Normal</option></select></div><div class="field"><div class="label">Dress code</div><input class="input" id="efDress" value="${esc(e.dress_code||'')}"></div><button class="primary" id="saveEvent">Save changes</button><button class="outline" id="addCalendar">Add to Apple Calendar</button><button class="danger" id="deleteEvent">Delete event</button>`);document.getElementById('efPriority').value=e.priority||'Normal';document.getElementById('saveEvent').onclick=()=>{Object.assign(e,{name:val('efName'),category:val('efCategory'),date:val('efDate'),time:val('efTime'),venue:val('efVenue'),priority:val('efPriority'),dress_code:val('efDress')||null});saveCurrentProfile().then(()=>{closeSheet();render();toast('Event updated')})};document.getElementById('addCalendar').onclick=()=>addToCalendar(e);document.getElementById('deleteEvent').onclick=()=>{if(confirm('Delete this event?')){state.events=state.events.filter(x=>x.id!==e.id);saveCurrentProfile().then(()=>{closeSheet();render();toast('Event deleted')})}}}
function val(id){return document.getElementById(id)?.value||''}
function openAddLook(){openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">MY LOOKS</div><div class="panel-title">Add a look</div><div class="panel-sub">Upload a photo from your iPhone.</div></div><button class="x" data-close-sheet>×</button></div>${state.pendingLook?`<img src="${esc(state.pendingLook)}" style="width:100%;border-radius:18px;margin-top:14px;max-height:360px;object-fit:cover">`:''}<label class="upload-area file-label" for="lookFile" id="chooseLook" style="width:100%;margin-top:14px;display:block"><strong>＋ Choose outfit photo</strong><p>JPG, PNG or WebP</p></label><div class="field"><div class="label">Look name</div><input class="input" id="lookName" placeholder="e.g. Black dinner look"></div><div class="field"><div class="label">Notes</div><textarea class="textarea" id="lookNotes" placeholder="Shoes, watch, jacket, mood…"></textarea></div><button class="primary" id="saveLook">Save look</button>`);document.getElementById('saveLook').onclick=async()=>{if(!state.pendingLook){toast('Choose a photo first');return}const name=val('lookName')||'Untitled look';state.looks.push({id:uid('look'),name,dataUrl:state.pendingLook,notes:val('lookNotes')});state.pendingLook=null;await saveCurrentProfile();closeSheet();state.tab='looks';render();toast('Look saved')}}
async function makeLookFromFile(file){const r=new FileReader();r.onload=()=>{state.pendingLook=r.result;openAddLook();toast('Photo ready')};r.readAsDataURL(file)}
function openLookPicker(eventId){const e=state.events.find(x=>x.id===eventId);if(!e)return;state.lookForEvent=eventId;openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">STYLE THIS EVENT</div><div class="panel-title">Choose a look</div><div class="panel-sub">${esc(e.name)}</div></div><button class="x" data-close-sheet>×</button></div><div class="choice-grid"><button class="choice ${!e.lookId?'selected':''}" id="noLook"><div style="padding:22px;text-align:center">No look<br>assigned</div></button>${state.looks.map(l=>`<button class="choice ${e.lookId===l.id?'selected':''}" data-choose-look="${l.id}"><img src="${esc(l.dataUrl)}" alt=""><div>${esc(l.name)}</div></button>`).join('')}</div><button class="outline" id="newLookFromPicker">＋ Add a new look</button>`);document.getElementById('noLook').onclick=()=>assignLook(null,eventId);document.querySelectorAll('[data-choose-look]').forEach(b=>b.onclick=()=>assignLook(b.dataset.chooseLook,eventId));document.getElementById('newLookFromPicker').onclick=()=>{closeSheet();setTimeout(()=>openAddLook(),100)}}
function assignLook(lookId,eventId){const e=state.events.find(x=>x.id===eventId);if(e){e.lookId=lookId;saveCurrentProfile().then(()=>{closeSheet();render();toast(lookId?'Look assigned':'Look removed')})}}
function openProfiles(){const list=state.profiles.map(p=>`<div class="profile-item ${p.id===state.activeProfileId?'active':''}"><div class="profile-avatar">${esc(p.emoji||'☺')}</div><div class="pi-meta"><div class="pi-name">${esc(p.name)}</div><div class="pi-sub">${(p.events||[]).length} events · ${(p.looks||[]).length} looks</div></div>${p.id===state.activeProfileId?'<span style="font-size:9px;font-weight:800">CURRENT</span>':`<button data-switch-profile="${esc(p.id)}">Switch</button>`}</div>`).join('');openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">DRESSED / PROFILES</div><div class="panel-title">Choose your profile.</div><div class="panel-sub">Each profile keeps its own events and looks on this device.</div></div><button class="x" data-close-sheet>×</button></div><div class="profile-list">${list}</div><div class="field"><div class="label">Add profile</div><div class="profile-add"><input class="input" id="newProfileName" placeholder="e.g. Mom, Dad, Sarah"><button class="primary" style="margin-top:0;width:110px" id="addProfile">Add</button></div></div><p style="font-size:10px;margin-top:12px">Profiles are private to this browser/device in the API-free version. For true multi-device accounts and cloud sync, we would add a small login backend later.</p>`);document.querySelectorAll('[data-switch-profile]').forEach(b=>b.onclick=()=>switchProfile(b.dataset.switchProfile));document.getElementById('addProfile').onclick=async()=>{const name=val('newProfileName').trim();if(!name){toast('Enter a profile name');return}const p={id:uid('profile'),name,emoji:'☺',events:[],looks:[]};state.profiles.push(p);await put('profiles',p);await switchProfile(p.id)}}
function openSettings(){openSheet(`<div class="grab"></div><div class="panel-head"><div><div class="eyebrow">DRESSED / PRIVATE</div><div class="panel-title">Settings</div><div class="panel-sub">Built for personal use.</div></div><button class="x" data-close-sheet>×</button></div><div class="field"><div class="label">Invitation reader</div><p style="font-size:12px;margin:0">DRESSED processes PDFs, photos and sampled video frames locally in your browser. No OpenAI API key, account or AI subscription is required for invitation reading.</p></div><div class="field"><div class="label">Monthly usage</div><p style="font-size:12px;margin:0">Designed for roughly 10 invitations a month. Your events and looks stay in this browser.</p></div><button class="outline" id="demoBtn">Try the Rajbeer & Srishti demo</button><button class="danger" id="clearBtn">Clear all DRESSED data</button>`);document.getElementById('demoBtn').onclick=()=>{closeSheet();openDemo()};document.getElementById('clearBtn').onclick=()=>{if(confirm('Clear all events and looks from this browser?')){state.events=[];state.looks=[];saveCurrentProfile().then(()=>{closeSheet();render();toast('DRESSED cleared')})}}}
function openDemo(){openReview({events:[{name:'Poolside Reverie',date:'2026-10-30',time:'3:00 PM onwards',venue:'Poolside Area',category:'WELCOME POOL PARTY',dress_code:null,host:'WADHAWAN FAMILY',priority:'Normal',confidence:1,notes:null},{name:'Black Tie & Beats',date:'2026-10-30',time:'9:00 PM onwards',venue:'Shivalik Grand Lawn',category:'COCKTAIL NIGHT',dress_code:null,host:'WADHAWAN FAMILY',priority:'Normal',confidence:1,notes:null},{name:'Sunset Soirée',date:'2026-10-31',time:'2:00 PM onwards',venue:'Aqua Current',category:'SUNDOWNER',dress_code:null,host:'WADHAWAN FAMILY',priority:'Normal',confidence:1,notes:null},{name:'Mehfil - e - Ishq',date:'2026-10-31',time:'9:00 PM onwards',venue:'Shivalik Grand Lawn',category:'SUFI NIGHT',dress_code:null,host:'WADHAWAN FAMILY',priority:'Normal',confidence:1,notes:null}]},'Pre Wedding #SrishKaRaj.pdf',true)}
function addToCalendar(e){const start=startDate(e.date,e.time),end=new Date(start.getTime()+2*60*60*1000),pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`,hm=d=>`${ymd(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`,text=v=>String(v||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DRESSED//EN','BEGIN:VEVENT',`UID:${e.id}@dressed`,`DTSTAMP:${hm(new Date())}`,`DTSTART:${hm(start)}`,`DTEND:${hm(end)}`,`SUMMARY:${text(e.name)}`,`LOCATION:${text(e.venue)}`,`DESCRIPTION:${text(`${e.category||''}${e.dress_code?' | Dress code: '+e.dress_code:''}\nOriginal time: ${e.time||''}`)}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');const file=new File([ics],'dressed-event.ics',{type:'text/calendar'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:e.name}).then(()=>toast('Share the event to Calendar')).catch(err=>{if(err?.name!=='AbortError')toast('Could not create calendar event')})}else{const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));const a=document.createElement('a');a.href=url;a.download='dressed-event.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Event file created — open it with Calendar')}}
window.addEventListener('load',async()=>{await initDB();render();});
</script>
